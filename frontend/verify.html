<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification - ClauzIA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f6f0ea;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #111;
      font-size: 24px;
    }
    p {
      color: #555;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0284c7;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      display: none;
    }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="statusTitle">Vérification en cours...</h1>
    <div class="loader" id="loader"></div>
    <p id="statusMessage">Veuillez patienter pendant que nous validons votre adresse email.</p>
    <a href="login.html" class="btn" id="loginBtn">Aller à la connexion</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      
      const statusTitle = document.getElementById("statusTitle");
      const statusMessage = document.getElementById("statusMessage");
      const loader = document.getElementById("loader");
      const loginBtn = document.getElementById("loginBtn");

      if (!token) {
        loader.style.display = "none";
        statusTitle.textContent = "Lien invalide";
        statusTitle.className = "error";
        statusMessage.textContent = "Aucun jeton de vérification n'a été trouvé dans l'URL.";
        return;
      }

      try {
        // L'appel à ton API backend existante
        const response = await fetch(`/api/auth/verify/${token}`);
        const data = await response.json();

        loader.style.display = "none";

        if (response.ok) {
          statusTitle.textContent = "Email vérifié !";
          statusTitle.className = "success";
          statusMessage.textContent = "Votre compte ClauzIA est maintenant activé. Vous pouvez vous connecter.";
          loginBtn.style.display = "inline-block";
        } else {
          statusTitle.textContent = "Échec de la vérification";
          statusTitle.className = "error";
          statusMessage.textContent = data.message || "Le lien est invalide ou a expiré.";
        }
      } catch (error) {
        loader.style.display = "none";
        statusTitle.textContent = "Erreur de connexion";
        statusTitle.className = "error";
        statusMessage.textContent = "Impossible de joindre le serveur. Veuillez réessayer plus tard.";
      }
    });
  </script>
</body>
</html>
